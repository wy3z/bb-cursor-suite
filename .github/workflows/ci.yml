name: CI

on:
  push:
    branches: [main]
    tags: ["*/v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      SUITE_NO_GUARD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global bb-app@0.49.0
      - run: npm ci
      - run: npm run versions
      - run: npm run check:all

  install:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: cursor-sidebar
          - plugin: cursor-sidebar
            legacy: true
          - plugin: agent-pills
          - plugin: filetree
          - plugin: projects
          - plugin: pull-requests
          - plugin: ui-tweaks
          - plugin: ui-tweaks
            legacy: true
    name: install ${{ matrix.plugin }}${{ matrix.legacy && ' (legacy layout)' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global bb-app@0.49.0
      - run: node scripts/install-check.mjs ${{ matrix.plugin }} ${{ matrix.legacy && '--legacy' || '' }}

  install-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global bb-app@0.49.0
      - name: Install the tagged plugin as BB would
        env:
          TAG: ${{ github.ref_name }}
        run: |
          plugin="${TAG%%/v*}"
          node scripts/install-check.mjs "$plugin" --ref HEAD
          if node -e 'import("./scripts/versions.mjs").then((m) => process.exit(m.legacyStreams[process.argv[1]] ? 0 : 1))' "$plugin"; then
            node scripts/install-check.mjs "$plugin" --ref HEAD --legacy
          fi
